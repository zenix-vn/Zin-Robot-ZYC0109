[platformio]
default_envs = bluepill

[env:bluepill]
platform = ststm32
board = bluepill_f103c8_128k
framework = cmsis
build_flags = -Os -Wall -Wextra

; bench test without Bluetooth: peripherals only, motors stay off
[env:selftest]
extends = env:bluepill
build_flags = ${env:bluepill.build_flags} -DSELFTEST=1

; same, plus a short motor sequence (wheels must be off the ground)
[env:selftest_motors]
extends = env:bluepill
build_flags = ${env:bluepill.build_flags} -DSELFTEST=1 -DSELFTEST_MOTORS=1

