; ESP32-CAM of the ZYC0109 robot: own Wi-Fi access point + MJPEG stream at http://192.168.4.1/
; and a PS5 DualSense (or other Bluetooth gamepad) paired straight to the robot, through Bluepad32.
; ESP-IDF 5.5 because Bluepad32 / BTstack need it; the old Arduino build is gone.
; Third-party code: components/bluepad32 (+ cmd_nvs, cmd_system) from Bluepad32, external/btstack (git submodule).
[platformio]
src_dir = main

[env:esp32cam]
platform = espressif32@8.0.0
platform_packages =
    platformio/framework-espidf@~4.50505.0
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
framework = espidf
board = esp32cam
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
